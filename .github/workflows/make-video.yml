name: Make video

# SHA-pinned actions verified for repository policy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = built-in demo; real = Gemini if configured; real-free = RSS/HN + no API"
        required: true
        type: choice
        options:
          - test
          - real
          - real-free
        default: test
  push:
    paths:
      - "config.yml"
      - "main.py"
      - "media.py"
      - "content.py"
      - "requirements.txt"
      - ".github/workflows/make-video.yml"\n      - "tests/**"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USHORA_FORCE_FREE_SCRIPT: ${{ (github.event_name == 'push' || inputs.mode == 'real-free') && '1' || '0' }}
        run: |
          MODE="${{ inputs.mode || 'real-free' }}"
          if [ "$MODE" = "real-free" ]; then MODE="real"; fi
          python main.py --mode "$MODE" --out out --work work

      - name: Validate generated video
        run: |
          test -s out/video.mp4
          test -s out/metadata.json
          python - <<'PY'
          import json, subprocess
          info = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_streams", "-show_format",
              "-of", "json", "out/video.mp4"
          ], text=True))
          streams = info.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          assert video is not None, "No video stream found"
          assert audio is not None, "No audio stream found"
          assert (video.get("width"), video.get("height")) == (1080, 1920), (
              f"Expected 1080x1920 portrait, got {video.get('width')}x{video.get('height')}"
          )
          seconds = float(info["format"]["duration"])
          assert 5 <= seconds <= 180, f"Unexpected duration: {seconds:.1f}s"
          meta = json.load(open("out/metadata.json", encoding="utf-8"))
          assert abs(float(meta["duration_seconds"]) - seconds) < 2.0, "Metadata duration mismatch"
          print(f"QA PASS: {seconds:.1f}s, 1080x1920, video+audio streams, metadata present")
          PY

      - name: Save generated video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ushora-video-output
          path: out/
          if-no-files-found: warn
