name: Make video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Test uses built-in script; real uses Gemini + fresh tech topics"
        required: true
        type: choice
        options:
          - test
          - real
        default: test
  push:
    paths:
      - "config.yml"
      - "main.py"
      - "media.py"
      - "content.py"
      - "requirements.txt"
      - ".github/workflows/make-video.yml"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          MODE="${{ inputs.mode || 'test' }}"
          python main.py --mode "$MODE" --out out --work work

      - name: Save generated video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ushora-video-output
          path: out/
          if-no-files-found: warn
