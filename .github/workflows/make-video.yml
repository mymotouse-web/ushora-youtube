name: Make video

# SHA-pinned actions verified for repository policy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = built-in demo; real = Gemini if configured; real-free = RSS/HN + no API"
        required: true
        type: choice
        options:
          - test
          - real
          - real-free
        default: test
  push:
    paths:
      - "config.yml"
      - "main.py"
      - "media.py"
      - "content.py"
      - "requirements.txt"
      - ".github/workflows/make-video.yml"

permissions:
  contents: read

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USHORA_FORCE_FREE_SCRIPT: ${{ inputs.mode == 'real-free' && '1' || '0' }}
        run: |
          MODE="${{ inputs.mode || 'test' }}"
          if [ "$MODE" = "real-free" ]; then MODE="real"; fi
          python main.py --mode "$MODE" --out out --work work

      - name: Save generated video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ushora-video-output
          path: out/
          if-no-files-found: warn
