# ======================================================================
#  USHORA AI & TECHNOLOGY - "Make video" workflow
#  This file MUST live at:  .github/workflows/make-video.yml
#  Run it from your phone: Repo > Actions > Make video > Run workflow
# ======================================================================
name: Make video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = built-in script, needs NO keys | real = find topic + write script (needs GEMINI_API_KEY)"
        type: choice
        options: [test, real]
        default: test
      upload:
        description: "Upload to YouTube (Plan B). Keep OFF until we finish YouTube setup."
        type: boolean
        default: false

  # ---- SCHEDULE: OFF until you remove the '#' signs (do this only after tests pass) ----
  # schedule:
  #   - cron: "30 1 * * 1,4"    # 07:00 AM India time, every Monday and Thursday (times are in UTC)

permissions:
  contents: write          # needed to save topic history and create the draft release

concurrency:
  group: make-video
  cancel-in-progress: false

env:
  MODE: ${{ inputs.mode || 'real' }}
  DO_UPLOAD: ${{ inputs.upload && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg, fonts and backup voice
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Build the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "$DO_UPLOAD" = "true" ]; then
            python main.py --mode "$MODE" --upload
          else
            python main.py --mode "$MODE"
          fi

      - name: Save files (zip)
        uses: actions/upload-artifact@v7
        with:
          name: ushora-video-${{ github.run_number }}
          path: out/
          retention-days: 14

      - name: Save files (draft release - easiest to download on a phone)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" \
            out/video.mp4 out/thumbnail.jpg out/subtitles.srt out/metadata.json \
            --draft --title "$(jq -r .title out/metadata.json)" --notes-file out/metadata.md

      - name: Remember used topic (real mode only)
        if: ${{ env.MODE == 'real' }}
        run: |
          git config user.name "ushora-bot"
          git config user.email "ushora-bot@users.noreply.github.com"
          git add data/history.json || true
          git diff --cached --quiet || (git commit -m "Update topic history" && git push)
